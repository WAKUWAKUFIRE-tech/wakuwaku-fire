name: WAKUWAKU FIRE daily poi update

on:
  schedule:
    # 06:00 JST = 21:00 UTC (前日)
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wakuwaku-fire-poi-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Sync the latest main branch
        run: git pull --rebase origin main

      - name: Update the fixed poi page
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          POI_MAX_DEALS: "30"
          A8_LINK_MANAGER_SCRIPT: ${{ vars.A8_LINK_MANAGER_SCRIPT || secrets.A8_LINK_MANAGER_SCRIPT }}
          A8_LINK_MANAGER_SCRIPT_TAG: ${{ vars.A8_LINK_MANAGER_SCRIPT_TAG || secrets.A8_LINK_MANAGER_SCRIPT_TAG }}
          A8_LINK_MANAGER_SCRIPT_URL: ${{ vars.A8_LINK_MANAGER_SCRIPT_URL || secrets.A8_LINK_MANAGER_SCRIPT_URL }}
          AMAZON_ASSOCIATE_URL: ${{ vars.AMAZON_ASSOCIATE_URL || secrets.AMAZON_ASSOCIATE_URL }}
        run: npm run poi:update

      - name: Validate the updated poi page
        run: npm run validate:poi

      - name: Commit generated poi data and page
        run: |
          git config user.name "wakuwaku-fire-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/otoku/deals.json otoku/index.html sitemap.xml automation/otoku/run-log.json automation/otoku/affiliate-analysis.json
          if git diff --cached --quiet; then
            echo "No generated poi changes to commit."
          else
            git commit -m "Update daily poi deals"
            git push origin HEAD:main
          fi
